---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.author %} by {{ page.author }}{% endif %}
    </p>
  </header>

  <section id="content-section">
    <div class="card blog">
    {{ content }}
    </div>
  </section>

</article>
