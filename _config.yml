# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ZingLab
tagline: "Speed reading, pixel art, memory training, games, research, and web development"
email: info@zinglab.com
description: >- # this means to ignore newlines until "baseurl:"
  ZingLab is an independent R&D lab and software studio. We build HotGato, the most advanced free speed reader online;
  Zoetrope, a private in-browser GIF and pixel art animator; GlyphRecall memory training; browser games; dementia
  screening research tools; and custom websites, web apps, and marketing technology for clients.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://zinglab.com"
lang: en_US
locale: en_US
timezone: America/New_York
github_username: TheRedJalapeno
logo: /assets/logo.png
author:
  name: Robert Allen
  url: https://zinglab.com/about/
social:
  name: ZingLab
  links:
    - https://github.com/TheRedJalapeno
    - https://www.linkedin.com/in/robertdallenmba/
    - https://www.crunchbase.com/person/robert-allen-55cf

# Posts dated in the future are NOT published. Scheduled posts go live when
# .github/workflows/scheduled-publish.yml rebuilds the site every Monday.
future: false

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  posts_limit: 50

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Robert Allen
  - scope:
      path: "2024-deprecated"
    values:
      sitemap: false

exclude:
  - 2024-deprecated/
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.af"
  - vendor/
