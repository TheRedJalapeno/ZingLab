<section id="blog" class="blog">
    <h1>Success Stories</h1>
    {%- assign blogposts = site.posts | where: "type", "success" | sort: "date" | reverse -%}
    {%- if blogposts and blogposts.size > 0 -%}
        {%- for post in blogposts -%}
            <a class="bloglink" href="{{ post.url | relative_url }}">{{ post.title }}</a>
        {%- endfor -%}
    {%- else -%}
        <p>No blog posts yet.</p>
    {%- endif -%}
</section>
