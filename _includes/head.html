<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    {%- if page.keywords %}
    <meta name="keywords" content="{{ page.keywords }}">
    {%- endif %}
    <meta name="robots" content="{% if page.noindex %}noindex, follow{% else %}index, follow, max-image-preview:large, max-snippet:-1{% endif %}">

    <!-- SEO: canonical, Open Graph, Twitter cards, JSON-LD (jekyll-seo-tag) -->
    {% seo title=false %}
    {%- if page.last_modified_at %}
    <meta property="article:modified_time" content="{{ page.last_modified_at | date_to_xmlschema }}">
    {%- endif %}

    {%- if page.url == "/" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "name": "ZingLab",
      "description": {{ site.description | strip | jsonify }},
      "address": { "@type": "PostalAddress", "addressLocality": "Melbourne", "addressRegion": "FL", "addressCountry": "US" },
      "areaServed": "Worldwide",
      "knowsAbout": ["Custom web development", "Web application development", "Marketing technology", "Marketing operations", "AI integration", "Model Context Protocol (MCP) servers", "API development", "Search engine optimization", "Speed reading software", "Pixel art and GIF animation software"],
      "url": "{{ site.url }}/",
      "logo": "{{ site.logo | absolute_url }}",
      "email": "{{ site.email }}",
      "founder": { "@type": "Person", "name": "Robert Allen", "honorificSuffix": "MBA", "jobTitle": "Founder & CEO", "url": "{{ '/about/' | absolute_url }}", "sameAs": ["https://www.linkedin.com/in/robertdallenmba/", "https://www.crunchbase.com/person/robert-allen-55cf"] },
      "sameAs": {{ site.social.links | jsonify }},
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "SoftwareApplication", "name": "HotGato Speed Reader", "url": "https://hotgato.com", "applicationCategory": "EducationalApplication" } },
        { "@type": "Offer", "itemOffered": { "@type": "SoftwareApplication", "name": "Zoetrope GIF Animator", "url": "https://zoetrope.zinglab.com", "applicationCategory": "MultimediaApplication" } },
        { "@type": "Offer", "itemOffered": { "@type": "SoftwareApplication", "name": "LeadAlign", "url": "https://leadalign.com", "applicationCategory": "BusinessApplication" } },
        { "@type": "Offer", "itemOffered": { "@type": "SoftwareApplication", "name": "RingFence Radius Search", "url": "https://ringfencegeo.com", "applicationCategory": "BusinessApplication" } },
        { "@type": "Offer", "itemOffered": { "@type": "SoftwareApplication", "name": "GlyphRecall Memory Trainer", "url": "https://glyphrecall.com", "applicationCategory": "GameApplication" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom web app development", "serviceType": "Web application development" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website and landing page development", "serviceType": "Web development" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Marketing technology and marketing operations consulting", "serviceType": "Marketing technology" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI integrations, chatbots, and MCP servers", "serviceType": "AI integration" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "API development and system integrations", "serviceType": "API development" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website rescue and performance optimization", "serviceType": "Website maintenance" } }
      ]
    }
    </script>
    {%- endif %}

    {%- if page.faq %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in page.faq %}
        { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
    </script>
    {%- endif %}

    <!-- Feeds and machine-readable indexes -->
    {% feed_meta %}
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | relative_url }}">
    <link rel="alternate" type="text/plain" title="LLM-friendly site index" href="{{ '/llms.txt' | relative_url }}">

    <!-- Favicon -->
    <link rel="icon" href="{{ "/assets/favicon.png" | relative_url }}" type="image/png">

    <!-- CSS Stylesheet (versioned per build so Cloudflare/browser caches pick up changes immediately) -->
    <link rel="stylesheet" href="{{ "/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8YRFZ6SBHS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-8YRFZ6SBHS');
    </script>
</head>
